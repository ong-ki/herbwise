<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#476d50" />
      <stop offset="100%" stop-color="#293b2d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6cc8d" />
      <stop offset="100%" stop-color="#e59325" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141c16" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#sageGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#7ba384" stroke-width="4" stroke-opacity="0.3" />

  <!-- Botanical Emblem Center -->
  <g transform="translate(256, 256)">
    <!-- Golden Decorative Ring -->
    <circle r="160" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />
    <circle r="142" fill="#243327" opacity="0.8" />
    
    <!-- Central Botanical Leaf / Sprout Motif -->
    <!-- Main stem -->
    <path d="M-40,110 C-10,60 30,10 90,-80" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Large Organic Leaf -->
    <path d="M-40,110 C-110,60 -110,-40 -20,-90 C40,-130 90,-80 90,-80 C80,-10 30,40 -40,110 Z" 
          fill="#FAF9F5" 
          opacity="0.95" />
    
    <!-- Inner Leaf Vein -->
    <path d="M-30,90 C-40,40 -30,-10 20,-60" fill="none" stroke="#5c8866" stroke-width="6" stroke-linecap="round" opacity="0.7" />
    
    <!-- Secondary Sprout Leaf -->
    <path d="M10,-10 C40,-50 100,-60 120,-30 C130,10 90,40 50,30 C30,25 20,10 10,-10 Z" 
          fill="url(#goldGrad)" 
          opacity="0.9" />
          
    <!-- Small herbal droplet -->
    <circle cx="65" cy="-85" r="14" fill="#FAF9F5" />
  </g>
</svg>
